description: |-
  This is a placeholder for the mechanism that previously had this name but was actually
  built for n-heptane, not n-hexane. This file will be removed in a future Cantera
  release.

phases:
- name: gas
  thermo: ideal-gas
  kinetics: bulk
  species: [{n-heptane-NUIG-2016.yaml/species: all}]
  reactions: [{n-heptane-NUIG-2016.yaml/reactions: all}]
  deprecated: >-
    The input file 'n-hexane-NUIG-2015.yaml' is deprecated and will be removed in a
    future Cantera release. Despite the file name, this mechanism is actually for
    n-heptane, not n-hexane. Please use 'n-heptane-NUIG-2016.yaml' instead.
